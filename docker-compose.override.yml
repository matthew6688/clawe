services:
  squadhub:
    ports:
      - "18790:18789"
    volumes:
      - ./.squadhub:/data
      - ./.squadhub/logs:/tmp/openclaw
      - .:/home/ubuntu/clawe
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Override CONVEX_URL to use host.docker.internal for Docker
      - CONVEX_URL=http://host.docker.internal:3210

  watcher:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - CONVEX_URL=http://host.docker.internal:3210
      - WATCHER_NOTIFICATION_SEND_TIMEOUT_SECONDS=${WATCHER_NOTIFICATION_SEND_TIMEOUT_SECONDS:-20}
      - WATCHER_NOTIFICATION_STALE_AFTER_MS=${WATCHER_NOTIFICATION_STALE_AFTER_MS:-900000}
      - WATCHER_NOTIFICATION_MAX_PER_AGENT_PER_LOOP=${WATCHER_NOTIFICATION_MAX_PER_AGENT_PER_LOOP:-2}

  clawe:
    profiles:
      - production
    volumes:
      - ./.squadhub:/squadhub-host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - CONVEX_URL=http://host.docker.internal:3210
      - NEXT_PUBLIC_CONVEX_URL=http://localhost:3210
      - CLAWE_CHAT_DEBUG=${CLAWE_CHAT_DEBUG:-true}
      - CLAWE_TARGET_DISPATCH_TIMEOUT_SECONDS=${CLAWE_TARGET_DISPATCH_TIMEOUT_SECONDS:-75}
      - CLAWE_COLLAB_DISPATCH_TIMEOUT_SECONDS=${CLAWE_COLLAB_DISPATCH_TIMEOUT_SECONDS:-120}
      - CLAWE_MENTION_DISPATCH_MODE=${CLAWE_MENTION_DISPATCH_MODE:-sync}
      - CLAWE_REQUIRE_DELEGATION_CONFIRMATION=${CLAWE_REQUIRE_DELEGATION_CONFIRMATION:-true}
      - CLAWE_APPEND_LEAD_SYNTHESIS=${CLAWE_APPEND_LEAD_SYNTHESIS:-true}
      - CLAWE_LEAD_SYNTHESIS_TIMEOUT_SECONDS=${CLAWE_LEAD_SYNTHESIS_TIMEOUT_SECONDS:-45}
      - CLAWE_MARK_SYNC_NOTIFICATIONS_DELIVERED=${CLAWE_MARK_SYNC_NOTIFICATIONS_DELIVERED:-true}
      - CLAWE_SESSION_SEND_TIMEOUT_SECONDS=${CLAWE_SESSION_SEND_TIMEOUT_SECONDS:-120}
      - CLAWE_HEARTBEAT_CRON_MODE=${CLAWE_HEARTBEAT_CRON_MODE:-off}
